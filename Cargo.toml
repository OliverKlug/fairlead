[workspace]
members = ["crates/fairlead-core", "crates/fairlead-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OliverKlug/fairlead"

[workspace.dependencies]
cedar-policy = "4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = "2.2"
getrandom = "0.2"
serde_json_canonicalizer = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
